[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rivet-worker"
version = "0.6.0"
description = "Rights-aware video highlight worker and review control plane"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rivet-api = "rivet.api:main"
rivet-worker = "rivet.worker:main"
rivet-publisher = "rivet.publisher:main"

[tool.setuptools.packages.find]
include = ["rivet*"]

[tool.setuptools.package-data]
rivet = ["dashboard.html"]

