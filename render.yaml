services:
  - type: web
    name: rivet-worker
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    disk:
      name: rivet-data
      mountPath: /var/lib/rivet
      sizeGB: 10
    envVars:
      - key: RIVET_DATA_DIR
        value: /var/lib/rivet
      - key: RIVET_STORAGE_DURABILITY
        value: persistent
      - key: RIVET_ADMIN_TOKEN
        generateValue: true
      - key: RIVET_PUBLISH_EXECUTION_ENABLED
        value: "false"
      - key: RIVET_MAX_SOURCE_BYTES
        value: "2147483648"

